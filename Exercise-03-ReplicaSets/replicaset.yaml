
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: flask-replicaset
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flask-replicaset
  template:
    metadata:
      labels:
        app: flask-replicaset
    spec:
      containers:
        - name: flask-app
          image: flask-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 15000
